[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-decision-agent"
version = "1.0.0"
description = "Evidence-grounded, uncertainty-aware job application decision agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.68.0", "python-dotenv>=1.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-agent = "job_agent.cli:main"
job-agent-configure = "job_agent.credentials:main"
job-agent-batch = "job_agent.batch:main"
job-agent-evaluate = "job_agent.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
